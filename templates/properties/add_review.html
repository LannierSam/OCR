{% extends 'base.html' %}

{% block title %}Add Review - OCR Management System{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-12 py-12">
    <!-- Breadcrumb -->
    <nav class="flex items-center gap-2 text-sm mb-8">
        <a href="{% url 'property_detail' property_id=property.id %}" class="text-blue-600 hover:text-blue-700 font-medium">
            <i class="fas fa-arrow-left mr-1"></i> Back to Property
        </a>
    </nav>
    
    <div class="max-w-2xl mx-auto">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
            <h2 class="text-2xl font-bold text-blue-900 mb-2">
                <i class="fas fa-star text-yellow-400 mr-2"></i>Add Review for {{ property.property_name }}
            </h2>
            <p class="text-gray-500 mb-6">Share your experience with this property</p>
            
            <form method="post">
                {% csrf_token %}
                <div class="mb-6">
                    <label for="id_rating" class="block text-sm font-medium text-gray-700 mb-2">Rating</label>
                    <select class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition" 
                            id="id_rating" name="rating" required>
                        <option value="">Select rating</option>
                        <option value="5">5 Stars - Excellent</option>
                        <option value="4">4 Stars - Very Good</option>
                        <option value="3">3 Stars - Good</option>
                        <option value="2">2 Stars - Fair</option>
                        <option value="1">1 Star - Poor</option>
                    </select>
                </div>
                <div class="mb-6">
                    <label for="id_comment" class="block text-sm font-medium text-gray-700 mb-2">Comment (Optional)</label>
                    <textarea class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition" 
                              id="id_comment" name="comment" rows="4" placeholder="Share your experience living here..."></textarea>
                </div>
                <div class="flex gap-4">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-bold transition btn-hover">
                        <i class="fas fa-paper-plane mr-2"></i>Submit Review
                    </button>
                    <a href="{% url 'property_detail' property_id=property.id %}" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-6 py-3 rounded-xl font-bold transition">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
