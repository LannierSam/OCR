{% extends 'base.html' %}

{% block title %}Send Message - OCR Management System{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-12 py-12">
    <!-- Breadcrumb -->
    <nav class="flex items-center gap-2 text-sm mb-8">
        <a href="{% url 'messages_list' %}" class="text-blue-600 hover:text-blue-700 font-medium">
            <i class="fas fa-arrow-left mr-1"></i> Messages
        </a>
    </nav>
    
    <div class="max-w-2xl mx-auto">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
            <h2 class="text-2xl font-bold text-blue-900 mb-2">
                <i class="fas fa-paper-plane text-blue-600 mr-2"></i>Send Message to {{ receiver.email }}
            </h2>
            
            <form method="post" class="mt-6">
                {% csrf_token %}
                <div class="mb-6">
                    <label for="id_content" class="block text-sm font-medium text-gray-700 mb-2">Message</label>
                    <textarea class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition" 
                              id="id_content" name="content" rows="6" placeholder="Type your message..." required></textarea>
                </div>
                <div class="flex gap-4">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-bold transition btn-hover">
                        <i class="fas fa-paper-plane mr-2"></i>Send Message
                    </button>
                    <a href="{% url 'messages_list' %}" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-6 py-3 rounded-xl font-bold transition">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
