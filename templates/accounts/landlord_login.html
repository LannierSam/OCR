{% extends 'base.html' %}
 
{% block title %}Landlord Login - OCR Management System{% endblock %}
 
{% block content %}
<div class="max-w-7xl mx-auto px-12 py-12">
    <div class="max-w-md mx-auto">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-green-600 mb-4 shadow-lg">
                    <i class="fas fa-home text-white text-2xl"></i>
                </div>
                <h2 class="text-3xl font-bold text-blue-900">Landlord Login</h2>
                <p class="mt-2 text-gray-500">Access your landlord portal</p>
            </div>
            
            <form method="post" class="space-y-5">
                {% csrf_token %}
                <div>
                    <label for="id_email" class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                    <div class="relative">
                        <i class="fas fa-envelope absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <input type="email" class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition {% if form.email.errors %}border-red-500{% endif %}" 
                               id="id_email" name="email" placeholder="your.email@example.com" required>
                    </div>
                    {% if form.email.errors %}
                        <p class="text-red-500 text-sm mt-1">{{ form.email.errors.0 }}</p>
                    {% endif %}
                </div>
                <div>
                    <label for="id_password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <input type="password" class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition" 
                               id="id_password" name="password" placeholder="Password" required>
                    </div>
                </div>
                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-xl font-bold transition shadow-lg">
                    <i class="fas fa-sign-in-alt mr-2"></i>Login
                </button>
            </form>
            
            <div class="text-center mt-6">
                <p class="text-gray-500">New landlord? <a href="{% url 'landlord_register' %}" class="text-orange-500 font-semibold">Register here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
